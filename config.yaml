# LiteLLM aliases provider-specific models so application code never embeds provider names.
model_list:
  - model_name: agent-pool
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY_1
      rpm: 30

  - model_name: agent-pool
    litellm_params:
      model: openrouter/liquid/lfm-2.5-2.6b:free
      api_key: os.environ/OPENROUTER_API_KEY
      rpm: 20

  - model_name: summary-pool
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
      rpm: 15

litellm_settings:
  # Cache provider responses locally and ignore optional parameters unsupported by a provider.
  cache: true
  cache_params:
    type: local
  drop_params: true

router_settings:
  # Spread requests over the agent pool and temporarily avoid repeatedly failing providers.
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  allowed_fails: 2
  cooldown_time: 30
